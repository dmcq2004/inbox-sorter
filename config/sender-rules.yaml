    folder: Ocado
    priority: FYI
  - match: amazon
    folder: Amazon
    priority: FYI
  - match: audible
    folder: Amazon/Audible
    priority: Bulk
  - match: ebay
    folder: null
    priority: FYI
  - match: myprotein
    folder: null
    priority: FYI
  - match: trustpilotmail.com
    folder: null
    priority: Bulk
  - match: bbr.com
    folder: Berry Bros
    priority: Bulk
  - match: smws
    folder: SMWS
    priority: Bulk

  # --- Newsletters
  - match: substack.com
    folder: Substack
    priority: Bulk
  - match: mail.beehiiv.com
    folder: Newsletters
    priority: Bulk
  - match: aisecret.us
    folder: Newsletters
    priority: Bulk
  - match: davewang.ai
    folder: Newsletters
    priority: Bulk
  - match: variantperception
    folder: Variant Perception
    priority: Bulk

  # --- Social / platforms
  - match: linkedin.com
    folder: LinkedIn
    priority: Bulk
  - match: accounts.google.com
    folder: Google
    priority: NeedsDom
    subject_override: { FYI: [You allowed] }
  - match: netflix
    folder: Netflix
    priority: Bulk
  - match: playstation
    folder: playstation
    priority: Bulk

  # --- Retail marketing (no folder; Bulk + archive)
  - { match: tmlewin.co.uk,       folder: null, priority: Bulk }
  - { match: fermob.com,          folder: null, priority: Bulk }
  - { match: sarahraven.com,      folder: null, priority: Bulk }
